name: Code Conductor CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/permissions-notifications-providers]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline-safe backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -m "not live_provider and not windows"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build dashboard
        working-directory: web
        run: npm run build
