name: Code Conductor CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/permissions-notifications-providers, feat/real-browser-verification-ci]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile benchmark harness
        run: python -m py_compile scripts/benchmark_tasks.py
      - name: Configure Git identity for checkpoint tests
        run: |
          git config --global user.name "Code Conductor CI"
          git config --global user.email "ci@example.com"
      - name: Run offline-safe backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -m "not live_provider and not windows and not browser_integration"

  browser-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run real browser verification integration tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -m browser_integration backend/tests/test_browser_integration.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build dashboard
        working-directory: web
        run: npm run build


  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Compile VS Code extension
        working-directory: extension
        run: npm run compile

  windows-command-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell scripts parse
        shell: pwsh
        run: |
          $files = @(
            "scripts/install-cxcode.ps1",
            "scripts/setup.ps1",
            "scripts/test.ps1",
            "scripts/run-background-backend.ps1",
            "scripts/install-background-task.ps1",
            "scripts/remove-background-task.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $_" }
              exit 1
            }
          }
      - name: Install and smoke-test cxcode command
        shell: pwsh
        run: |
          ./scripts/install-cxcode.ps1
          $bin = Join-Path $env:USERPROFILE "bin"
          $env:Path = "$bin;$env:Path"
          $actual = (cxcode where).Trim()
          $expected = (Resolve-Path ".").Path
          if ($actual -ne $expected) {
            throw "cxcode points to '$actual'; expected '$expected'"
          }
          Write-Host "cxcode command resolves correctly to $actual"
