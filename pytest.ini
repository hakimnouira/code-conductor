[pytest]
pythonpath = backend
asyncio_mode = auto
testpaths = backend/tests
norecursedirs = scripts .venv extension dist .git
markers =
    unit: Isolated unit tests that execute without external services or subprocesses
    mocked_integration: Integration tests using mock providers, fixtures, and local testclients
    live_provider: Live integration tests requiring real API credentials or running MCP/Copilot servers
    windows: Tests requiring Windows operating system facilities
    browser_integration: Tests requiring a real Playwright Chromium browser
